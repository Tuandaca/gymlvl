name: Verify GymLvl

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  database-and-edge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/db-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/db-tests/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check:edge
      - run: npm run test:edge

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - name: Build web (isolated test configuration)
        run: >-
          flutter build web --release
          --dart-define=SUPABASE_URL=http://127.0.0.1:54321
          --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_local_test
      - uses: actions/upload-artifact@v4
        with:
          name: web-test-build
          path: app/build/web
          retention-days: 7

  android-release-manifest:
    # Source checks alone cannot prove the merged release manifest keeps the
    # INTERNET permission (FND-BUG-001). This job merges it and inspects the
    # artifact. No signing keys are needed for a manifest merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - name: Unit-test the manifest gate
        run: node tools/android-verify/manifest-check.test.mjs
      - name: Prepare the Android Gradle project
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --debug
      - name: Merge and verify the release manifest
        run: node tools/android-verify/run.mjs
