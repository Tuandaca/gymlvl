name: Verify GymLvl

on:
  # `main` is the only development branch; every other ref reaches CI through a
  # pull request, so a topic branch push must not spend a full run.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A superseded run on the same ref carries no value: the newer commit is the one
# that has to be green. Safe here because every job is read-only and stateless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-and-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/db-tests
    steps:
      # Actions are pinned to full commit SHAs (FND-TEST-001). Every pinned
      # release below runs on the Node 22 runtime, so the Node 20 deprecation
      # warning no longer applies; subosito/flutter-action is a composite action.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/db-tests/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check:edge
      - run: npm run test:edge

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      # Generated-code drift is deliberately NOT gated yet: regenerating at the
      # pinned generator versions rewrites 12 tracked files (measured 2026-10-29,
      # R3), so a `git diff --exit-code` gate would fail immediately. See
      # FND-TEST-001 in docs/audits/codebase-health/REMEDIATION_EXECUTION.md.
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - name: Build web (isolated test configuration)
        run: >-
          flutter build web --release
          --dart-define=SUPABASE_URL=http://127.0.0.1:54321
          --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_local_test
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: web-test-build
          path: app/build/web
          retention-days: 7

  android-release-manifest:
    # Source checks alone cannot prove the merged release manifest keeps the
    # INTERNET permission (FND-BUG-001). This job merges it and inspects the
    # artifact. No signing keys are needed for a manifest merge.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true
      # 8 manifest assertions + 10 Gradle-invocation regressions = 18 cases.
      - name: Unit-test the Android verification tools
        run: |
          node tools/android-verify/manifest-check.test.mjs
          node tools/android-verify/invoke.test.mjs
      - name: Prepare the Android Gradle project
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --debug
      - name: Merge and verify the release manifest
        run: node tools/android-verify/run.mjs
